<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Aplicación web de lista de tareas hecha con HTML, CSS y JavaScript.">
  <title>To-Do List</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <main class="app">
    <header class="app__header">
      <h1 class="app__title">Mis tareas</h1>
      <p class="app__subtitle">Organiza tu día de forma simple.</p>
    </header>

    <form class="form-tarea" id="form-tarea" novalidate>
      <label class="visually-hidden" for="input-tarea">Título de la tarea</label>
      <input
        class="form-tarea__input"
        type="text"
        id="input-tarea"
        name="titulo"
        placeholder="¿Qué necesitas hacer?"
        autocomplete="off"
      >
      <button class="btn btn--primary" type="submit">Agregar</button>
    </form>

    <!-- Aquí se agregará la lista de tareas -->
  </main>

  <script src="assets/js/script.js"></script>
</body>
</html>
